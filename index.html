<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MGD Studio — Siti Web Moderni per Attività Locali</title>
  <meta name="description" content="MGD Studio: realizziamo siti web moderni, veloci e professionali per bar, ristoranti, parrucchieri, negozi e aziende." />
  <meta property="og:title" content="MGD Studio — Realizzazione Siti Web Professionali" />
  <meta property="og:description" content="Diamo vita alla tua presenza online. Scopri i nostri pacchetti chiari una tantum e richiedi il tuo sito personalizzato." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f8fafc;
      --bg-tertiary: #f1f5f9;
      --surface-card: #ffffff;
      --text-primary: #0a0f1d;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --accent-blue: #0052ff;
      --accent-blue-hover: #0041cc;
      --accent-blue-soft: #eff6ff;
      --accent-blue-subtle: #dbeafe;
      --border-subtle: #e2e8f0;
      --border-strong: #cbd5e1;
      --status-success: #15803d;
      --status-success-bg: #f0fdf4;
      --status-error: #b91c1c;
      --status-error-bg: #fef2f2;
      --shadow-xs: 0 1px 2px rgba(10, 15, 29, 0.04);
      --shadow-md: 0 12px 32px -4px rgba(10, 15, 29, 0.07), 0 4px 12px -2px rgba(10, 15, 29, 0.04);
      --shadow-lg: 0 24px 48px -12px rgba(10, 15, 29, 0.12);
      --shadow-blue: 0 12px 28px -6px rgba(0, 82, 255, 0.36);
      --radius-md: 12px;
      --radius-xl: 22px;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-display: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      --transition-fast: 180ms cubic-bezier(0.22, 1, 0.36, 1);
      --transition-smooth: 320ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; scroll-padding-top: 76px; }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.55;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    h1, h2, h3, .brand-logo, .pricing-price { font-family: var(--font-display); }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font: inherit; color: inherit; }

    /* Animazioni di comparsa */
    .reveal {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1), transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .container { width: 100%; max-width: 1140px; margin: 0 auto; padding: 0 20px; }
    .section { padding: 60px 0; }
    .section--alt { background-color: var(--bg-secondary); border-top: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle); }
    .section-header--center { max-width: 680px; margin: 0 auto 36px; text-align: center; }
    .section-eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: 0.74rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent-blue); background: var(--accent-blue-soft); padding: 4px 12px; border-radius: 999px; margin-bottom: 10px; }
    .section-title { font-size: clamp(1.7rem, 3vw, 2.35rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.16; margin-bottom: 10px; }
    .section-subtitle { font-size: 0.98rem; color: var(--text-secondary); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font-weight: 600; font-size: 0.94rem; line-height: 1.2; padding: 12px 22px;
      border-radius: var(--radius-md); border: 1.5px solid transparent; cursor: pointer;
      transition: all var(--transition-fast); white-space: nowrap;
    }
    .btn--primary {
      background: linear-gradient(135deg, #0052ff 0%, #1d6bff 100%);
      color: #ffffff;
      box-shadow: var(--shadow-blue);
    }
    .btn--primary:hover { background: var(--accent-blue-hover); transform: translateY(-2px); }
    .btn--secondary { background-color: var(--bg-primary); color: var(--text-primary); border-color: var(--border-strong); }
    .btn--secondary:hover { border-color: var(--accent-blue); color: var(--accent-blue); background-color: var(--accent-blue-soft); }
    .btn--dark { background-color: var(--text-primary); color: #ffffff; }
    .btn--dark:hover { background-color: var(--accent-blue); transform: translateY(-1px); }
    .btn--full { width: 100%; }
    .btn--sm { padding: 9px 16px; font-size: 0.85rem; }
    .btn--lg { padding: 14px 26px; font-size: 0.98rem; }

    /* HEADER */
    .site-header {
      position: sticky; top: 0; z-index: 100;
      background-color: rgba(255, 255, 255, 0.9); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
    }
    .navbar { display: flex; align-items: center; justify-content: space-between; height: 70px; gap: 16px; }
    .brand-logo { display: inline-flex; align-items: center; gap: 11px; font-weight: 800; font-size: 1.15rem; letter-spacing: -0.025em; }
    .brand-logo__img { height: 40px; width: auto; display: block; object-fit: contain; }
    .brand-logo__footer-badge { display: inline-flex; align-items: center; background: #ffffff; padding: 6px 12px; border-radius: 10px; }
    .nav-links { display: flex; align-items: center; gap: 24px; list-style: none; }
    .nav-link { font-size: 0.9rem; font-weight: 600; color: var(--text-secondary); transition: color var(--transition-fast); }
    .nav-link:hover { color: var(--accent-blue); }
    .nav-actions { display: flex; align-items: center; gap: 10px; }
    .mobile-menu-toggle { display: none; background: transparent; border: 1px solid var(--border-subtle); border-radius: 8px; width: 38px; height: 38px; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; }
    .mobile-drawer { display: none; background: #fff; border-bottom: 1px solid var(--border-subtle); padding: 14px 20px 18px; }
    .mobile-drawer.is-open { display: block; }
    .mobile-drawer__list { list-style: none; display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .mobile-drawer__link { display: block; padding: 8px 10px; font-weight: 600; border-radius: 6px; }

    /* 1. HOME HERO */
    .hero {
      padding: 52px 0 60px;
      background:
        radial-gradient(circle at 85% 20%, rgba(0, 82, 255, 0.14) 0%, transparent 48%),
        radial-gradient(circle at 12% 85%, rgba(16, 185, 129, 0.08) 0%, transparent 42%),
        linear-gradient(180deg, #f0f6ff 0%, #ffffff 65%, #f8fafc 100%);
      border-bottom: 1px solid var(--border-subtle);
    }
    .hero__grid { display: grid; grid-template-columns: 0.95fr 1.15fr; gap: 40px; align-items: center; }
    .hero__tag {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em;
      color: #ffffff; background: linear-gradient(135deg, #0a0f1d 0%, #1e293b 100%);
      padding: 7px 14px; border-radius: 999px; margin-bottom: 18px;
      box-shadow: 0 8px 20px -4px rgba(10, 15, 29, 0.25);
    }
    .hero__tag-dot { width: 8px; height: 8px; border-radius: 50%; background: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.28); }
    .hero__title { font-size: clamp(2.15rem, 4.1vw, 3.25rem); font-weight: 800; line-height: 1.07; letter-spacing: -0.035em; margin-bottom: 16px; }
    .hero__title-accent {
      background: linear-gradient(135deg, #0052ff 0%, #0ea5e9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      color: var(--accent-blue);
    }
    .hero__subtitle { font-size: 1.05rem; color: var(--text-secondary); margin-bottom: 26px; max-width: 500px; }
    .hero__cta-group { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
    .hero__highlights { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 18px; border-top: 1px solid var(--border-subtle); }
    .hero__highlight-item {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 0.82rem; font-weight: 700; color: var(--text-primary);
      background: #ffffff; border: 1px solid var(--border-subtle);
      padding: 6px 12px; border-radius: 999px; box-shadow: var(--shadow-xs);
    }
    .hero__highlight-icon {
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--accent-blue); color: #ffffff;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 0.68rem; font-weight: 800;
    }

    /* SHOWCASE INTERATTIVO CON FOTO VERE */
    .showcase-panel {
      background: #0a0f1d;
      border: 2px solid #1e293b;
      border-radius: 24px;
      box-shadow: 0 28px 60px -12px rgba(10, 15, 29, 0.28);
      overflow: hidden;
    }
    .showcase-tabs {
      display: flex;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      padding: 10px 12px;
      gap: 8px;
      overflow-x: auto;
    }
    .showcase-tab {
      padding: 8px 14px;
      font-size: 0.79rem;
      font-weight: 700;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: all var(--transition-fast);
    }
    .showcase-tab:hover { color: #ffffff; background: rgba(255, 255, 255, 0.1); }
    .showcase-tab.is-active {
      background: var(--accent-blue);
      color: #ffffff;
      border-color: var(--accent-blue);
      box-shadow: 0 4px 14px rgba(0, 82, 255, 0.45);
    }
    .showcase-browser-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 14px; border-bottom: 1px solid #1e293b; gap: 8px;
      background: #1e293b;
    }
    .browser-dots { display: flex; gap: 5px; }
    .browser-dot { width: 9px; height: 9px; border-radius: 50%; background: #475569; }
    .browser-dot--red { background: #ef4444; }
    .browser-dot--yellow { background: #f59e0b; }
    .browser-dot--green { background: #22c55e; }
    .browser-url {
      flex: 1; max-width: 230px;
      background: #0f172a; border: 1px solid #334155;
      border-radius: 6px; padding: 4px 10px;
      font-size: 0.72rem; font-family: var(--font-mono); color: #e2e8f0;
      text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .showcase-device-toggle { display: inline-flex; background: #0f172a; border: 1px solid #334155; border-radius: 7px; padding: 2px; }
    .device-btn { padding: 4px 10px; font-size: 0.71rem; font-weight: 700; border: none; background: transparent; color: #94a3b8; border-radius: 5px; cursor: pointer; transition: all var(--transition-fast); }
    .device-btn.is-active { background: var(--accent-blue); color: #ffffff; }
    .showcase-viewport {
      padding: 16px;
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
      min-height: 345px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .showcase-mockup {
      width: 100%;
      background: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      overflow: hidden;
      margin: 0 auto;
      box-shadow: 0 16px 36px -5px rgba(0, 0, 0, 0.45);
      transition: all var(--transition-smooth);
    }
    .showcase-mockup.is-mobile {
      max-width: 285px;
      border: 5px solid #334155;
      border-radius: 26px;
    }
    .mockup-notch {
      display: none;
      width: 72px; height: 14px;
      background: #0a0f1d;
      border-radius: 0 0 10px 10px;
      margin: 0 auto;
    }
    .showcase-mockup.is-mobile .mockup-notch { display: block; }
    .mockup-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; background: #fff; border-bottom: 1px solid var(--border-subtle);
    }
    .mockup-brand { font-size: 0.82rem; font-weight: 800; letter-spacing: -0.02em; color: var(--text-primary); }
    .mockup-badge { font-size: 0.65rem; font-weight: 700; color: var(--accent-blue); background: var(--accent-blue-soft); padding: 3px 8px; border-radius: 999px; }
    .mockup-visual-hero {
      position: relative;
      height: 165px;
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 14px;
      color: #ffffff;
    }
    .mockup-visual-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(10, 15, 29, 0.2) 0%, rgba(10, 15, 29, 0.88) 100%);
    }
    .mockup-visual-content { position: relative; z-index: 1; }
    .mockup-status-pill {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(10, 15, 29, 0.65); backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff; font-size: 0.63rem; font-weight: 700;
      padding: 3px 9px; border-radius: 999px; margin-bottom: 6px;
    }
    .mockup-status-dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; }
    .mockup-headline { font-size: 1.04rem; font-weight: 800; line-height: 1.2; margin-bottom: 3px; color: #fff; }
    .mockup-subline { font-size: 0.73rem; color: rgba(255, 255, 255, 0.9); margin-bottom: 10px; line-height: 1.35; }
    .mockup-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .mockup-btn-primary { background: var(--accent-blue); color: #fff; font-size: 0.7rem; font-weight: 700; padding: 6px 12px; border-radius: 6px; box-shadow: 0 4px 10px rgba(0, 82, 255, 0.4); }
    .mockup-btn-secondary { background: rgba(255, 255, 255, 0.95); color: var(--text-primary); font-size: 0.7rem; font-weight: 700; padding: 6px 12px; border-radius: 6px; }
    .mockup-body { padding: 12px 14px; background: #fff; }
    .mockup-cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .showcase-mockup.is-mobile .mockup-cards-grid { grid-template-columns: 1fr; }
    .mockup-mini-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .mockup-mini-card__top { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
    .mockup-mini-card__title { font-size: 0.71rem; font-weight: 700; color: var(--text-primary); }
    .mockup-mini-card__tag { font-size: 0.64rem; font-weight: 800; color: var(--accent-blue); background: var(--accent-blue-soft); padding: 1px 6px; border-radius: 4px; }
    .mockup-mini-card__desc { font-size: 0.65rem; color: var(--text-muted); }

    /* STRISCIA 3 PASSI */
    .steps-strip {
      background: #0a0f1d;
      color: #ffffff;
      padding: 24px 0;
    }
    .steps-strip__grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .steps-strip__item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .steps-strip__num {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, #0052ff 0%, #0ea5e9 100%); color: #fff;
      font-family: var(--font-display); font-weight: 800; font-size: 0.95rem;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      box-shadow: 0 6px 14px -3px rgba(0, 82, 255, 0.45);
    }
    .steps-strip__title { font-size: 0.9rem; font-weight: 800; color: #ffffff; margin-bottom: 2px; }
    .steps-strip__desc { font-size: 0.78rem; color: #cbd5e1; }

    /* 2. PACCHETTI */
    .pricing-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-bottom: 20px; align-items: stretch; }
    .pricing-card {
      background: #fff;
      border: 1.5px solid var(--border-subtle);
      border-radius: 20px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      transition: all var(--transition-smooth);
    }
    .pricing-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); }
    .pricing-card--featured {
      background: #0a0f1d;
      color: #ffffff;
      border: 2px solid var(--accent-blue);
      box-shadow: 0 24px 48px -12px rgba(10, 15, 29, 0.35);
      transform: scale(1.02);
    }
    .pricing-card--featured:hover { transform: scale(1.02) translateY(-5px); }
    .pricing-badge {
      position: absolute; top: -13px; right: 20px;
      background: linear-gradient(135deg, #0052ff 0%, #0ea5e9 100%);
      color: #fff; font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
      padding: 5px 14px; border-radius: 999px;
      box-shadow: 0 6px 14px rgba(0, 82, 255, 0.4);
    }
    .pricing-name { font-size: 0.78rem; font-weight: 800; color: var(--accent-blue); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
    .pricing-card--featured .pricing-name { color: #38bdf8; }
    .pricing-price-wrap { display: flex; align-items: baseline; gap: 8px; margin-bottom: 18px; padding-bottom: 16px; border-bottom: 1px solid var(--border-subtle); }
    .pricing-card--featured .pricing-price-wrap { border-bottom-color: rgba(255, 255, 255, 0.14); }
    .pricing-price { font-size: 2.7rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1; color: var(--text-primary); }
    .pricing-card--featured .pricing-price { color: #ffffff; }
    .pricing-billing { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
    .pricing-card--featured .pricing-billing { color: #94a3b8; }
    .pricing-features { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
    .pricing-feature-item { display: flex; align-items: flex-start; gap: 9px; font-size: 0.89rem; color: var(--text-secondary); }
    .pricing-card--featured .pricing-feature-item { color: #e2e8f0; }
    .pricing-check {
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--accent-blue-soft); color: var(--accent-blue);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 0.68rem; font-weight: 800; flex-shrink: 0; margin-top: 2px;
    }
    .pricing-card--featured .pricing-check { background: var(--accent-blue); color: #ffffff; }

    /* 3. MODULO MULTI-STEP */
    .wizard-wrapper { max-width: 820px; margin: 0 auto; background: #fff; border: 1px solid var(--border-subtle); border-radius: 22px; box-shadow: var(--shadow-lg); overflow: hidden; }
    .wizard-header { background: var(--bg-secondary); border-bottom: 1px solid var(--border-subtle); padding: 18px 24px; }
    .wizard-steps-indicator { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .step-pill { display: flex; align-items: center; gap: 7px; padding: 8px 10px; border-radius: 10px; background: #fff; border: 1px solid var(--border-subtle); font-size: 0.76rem; font-weight: 700; color: var(--text-secondary); transition: all var(--transition-fast); }
    .step-pill.is-active { border-color: var(--accent-blue); background: var(--accent-blue-soft); color: var(--accent-blue); }
    .step-pill.is-completed { border-color: #bbf7d0; background: #f0fdf4; color: var(--status-success); }
    .step-pill__num { width: 22px; height: 22px; border-radius: 50%; background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.72rem; flex-shrink: 0; }
    .step-pill.is-active .step-pill__num { background: var(--accent-blue); color: #fff; }
    .step-pill.is-completed .step-pill__num { background: var(--status-success); color: #fff; }
    .wizard-body { padding: 28px 24px; }
    .wizard-step-pane { display: none; }
    .wizard-step-pane.is-active { display: block; animation: fadeStep 0.25s ease-out; }
    @keyframes fadeStep { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .step-heading { font-size: 1.22rem; font-weight: 800; margin-bottom: 18px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group--full { grid-column: 1 / -1; }
    .form-label { font-size: 0.84rem; font-weight: 700; }
    .form-required { color: var(--accent-blue); }
    .form-input, .form-select, .form-textarea { width: 100%; padding: 11px 13px; border: 1.5px solid var(--border-subtle); border-radius: 9px; background: #fff; font-size: 0.92rem; transition: border-color var(--transition-fast), box-shadow var(--transition-fast); }
    .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--accent-blue); box-shadow: 0 0 0 3px var(--accent-blue-subtle); }
    .form-textarea { min-height: 84px; resize: vertical; }
    .field-error-msg { font-size: 0.76rem; font-weight: 600; color: var(--status-error); min-height: 14px; }
    .choice-cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .choice-cards-grid--styles { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    .choice-card { position: relative; border: 1.5px solid var(--border-subtle); border-radius: 12px; padding: 14px; cursor: pointer; background: #fff; display: flex; flex-direction: column; gap: 3px; transition: all var(--transition-fast); }
    .choice-card:hover { border-color: var(--border-strong); }
    .choice-card.is-selected { border-color: var(--accent-blue); background: var(--accent-blue-soft); box-shadow: 0 4px 12px rgba(0, 82, 255, 0.1); }
    .choice-card__title { font-weight: 800; font-size: 0.94rem; }
    .choice-card__price { font-size: 1.25rem; font-weight: 800; color: var(--accent-blue); }
    .choice-card__meta { font-size: 0.74rem; color: var(--text-secondary); }
    .choice-card input, .chip-option input, .yesno-btn input { position: absolute; opacity: 0; pointer-events: none; }
    .chips-grid { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip-option { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border: 1.5px solid var(--border-subtle); border-radius: 999px; font-size: 0.82rem; font-weight: 600; cursor: pointer; background: #fff; transition: all var(--transition-fast); }
    .chip-option.is-selected { background: var(--accent-blue); border-color: var(--accent-blue); color: #fff; }
    .color-swatch { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.2); }
    .yesno-group { display: flex; gap: 8px; }
    .yesno-btn { flex: 1; padding: 9px 12px; border: 1.5px solid var(--border-subtle); border-radius: 9px; font-size: 0.86rem; font-weight: 700; text-align: center; cursor: pointer; background: #fff; transition: all var(--transition-fast); }
    .yesno-btn.is-selected { border-color: var(--accent-blue); background: var(--accent-blue-soft); color: var(--accent-blue); }
    .summary-box { background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 14px; }
    .summary-box__header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border-subtle); }
    .summary-box__title { font-weight: 800; font-size: 0.88rem; }
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; font-size: 0.82rem; }
    .summary-item-label { color: var(--text-muted); font-weight: 600; display: block; }
    .summary-item-val { font-weight: 700; }
    .privacy-consent-box { display: flex; align-items: flex-start; gap: 10px; padding: 12px; border: 1.5px solid var(--border-subtle); border-radius: 9px; }
    .privacy-link-btn { color: var(--accent-blue); text-decoration: underline; font-weight: 700; background: none; border: none; cursor: pointer; }
    .hp-field-wrap { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    .wizard-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 20px; margin-top: 20px; border-top: 1px solid var(--border-subtle); gap: 12px; }
    .wizard-alert { padding: 10px 14px; border-radius: 9px; font-size: 0.85rem; font-weight: 600; margin-bottom: 14px; display: none; }
    .wizard-alert.is-visible { display: block; }
    .wizard-alert--info { background: var(--accent-blue-soft); color: var(--accent-blue); border: 1px solid var(--accent-blue-subtle); }
    .wizard-alert--error { background: var(--status-error-bg); color: var(--status-error); border: 1px solid #fecaca; }
    .wizard-confirmation { display: none; text-align: center; padding: 32px 16px; }
    .wizard-confirmation.is-visible { display: block; }
    .confirmation-icon { width: 60px; height: 60px; border-radius: 50%; background: var(--status-success-bg); color: var(--status-success); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 1.5rem; font-weight: 800; }
    .confirmation-title { font-size: 1.45rem; font-weight: 800; margin-bottom: 8px; }
    .confirmation-text { font-size: 0.98rem; color: var(--text-secondary); max-width: 480px; margin: 0 auto 18px; }

    /* FOOTER */
    .site-footer { background: var(--text-primary); color: #fff; padding: 40px 0 26px; }
    .footer-link { color: #cbd5e1; font-size: 0.85rem; background: none; border: none; cursor: pointer; }
    .footer-link:hover { color: #60a5fa; }
    .footer-bottom { padding-top: 18px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; font-size: 0.78rem; color: #94a3b8; }

    /* MODALI */
    .modal-backdrop { position: fixed; inset: 0; z-index: 200; background: rgba(10, 15, 29, 0.6); display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-backdrop.is-open { display: flex; }
    .modal-dialog { background: #fff; border-radius: 16px; max-width: 580px; width: 100%; overflow: hidden; }
    .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-weight: 800; font-size: 1rem; }
    .modal-close-btn { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--border-subtle); background: var(--bg-secondary); cursor: pointer; }
    .modal-content { padding: 20px; font-size: 0.88rem; color: var(--text-secondary); }

    @media (max-width: 900px) {
      .hero__grid, .pricing-grid, .steps-strip__grid { grid-template-columns: 1fr; }
      .nav-links, .nav-actions .btn { display: none; }
      .mobile-menu-toggle { display: inline-flex; }
      .wizard-steps-indicator { grid-template-columns: 1fr 1fr; }
      .form-grid, .choice-cards-grid, .summary-grid { grid-template-columns: 1fr; }
      .wizard-footer { flex-direction: column-reverse; align-items: stretch; }
      .wizard-footer .btn { width: 100%; }
    }

                    <div class="confirmation-icon">✓</div>
                    <h3 class="confirmation-title">Richiesta inviata!</h3>
                    <p class="confirmation-text">Grazie per averci contattato! Abbiamo ricevuto la tua richiesta e ti ricontatteremo al più presto.</p>
                    <button type="button" class="btn btn--secondary" id="btn-reset-wizard">Invia un’altra richiesta</button>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </main>

        <!-- FOOTER COMPATTO CON CONTATTI PULITI -->
        <footer class="site-footer" id="contatti">
          <div class="container">
            <div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:18px; padding-bottom:20px; border-bottom:1px solid rgba(255,255,255,0.12);">
              <div>
                <a href="#home" class="brand-logo" aria-label="MGD Studio">
                  <span class="brand-logo__footer-badge">
                    <img src="${siteConfig.logo.imageUrl}" alt="${siteConfig.logo.altText}" style="height:32px; width:auto; display:block;" />
                  </span>
                </a>
                <p style="color:#94a3b8; font-size:0.86rem; margin-top:8px;">
                  Contatto diretto: <a href="mailto:${siteConfig.contact.email}" style="color:#fff; font-weight:700; text-decoration:underline;">${siteConfig.contact.email}</a>
                </p>
              </div>
              <div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
                <a href="mailto:${siteConfig.contact.email}" class="btn btn--primary btn--sm">✉️ Scrivici via Email</a>
                <button type="button" class="footer-link" data-open-modal="privacy-modal">Privacy Policy</button>
                <button type="button" class="footer-link" data-open-modal="cookie-modal">Cookie Policy</button>
              </div>
            </div>
            <div class="footer-bottom">
              <p>© ${new Date().getFullYear()} ${siteConfig.agencyName} — Tutti i diritti riservati.</p>
              <p>Prezzi una tantum · Dominio e hosting da concordare separatamente.</p>
            </div>
          </div>
        </footer>

        <div class="modal-backdrop" id="privacy-modal">
          <div class="modal-dialog">
            <div class="modal-header">
              <h3 class="modal-title">Informativa sulla Privacy (GDPR)</h3>
              <button type="button" class="modal-close-btn" data-close-modal="privacy-modal">✕</button>
            </div>
            <div class="modal-content">
              <p>I dati inseriti nel modulo vengono utilizzati da <strong>${siteConfig.agencyName}</strong> (${siteConfig.contact.email}) esclusivamente per rispondere alla richiesta di preventivo, ai sensi del GDPR (Reg. UE 2016/679).</p>
            </div>
          </div>
        </div>

        <div class="modal-backdrop" id="cookie-modal">
          <div class="modal-dialog">
            <div class="modal-header">
              <h3 class="modal-title">Cookie Policy</h3>
              <button type="button" class="modal-close-btn" data-close-modal="cookie-modal">✕</button>
            </div>
            <div class="modal-content">
              <p>Questo sito utilizza esclusivamente cookie tecnici necessari al funzionamento e non impiega cookie di profilazione di terze parti.</p>
            </div>
          </div>
        </div>
      `;

      // Animazione fluida allo scorrimento
      const revealEls = document.querySelectorAll('.reveal');
      if ('IntersectionObserver' in window) {
        const io = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              io.unobserve(entry.target);
            }
          });
        }, { threshold: 0.12 });
        revealEls.forEach(el => io.observe(el));
      } else {
        revealEls.forEach(el => el.classList.add('is-visible'));
      }

      const toggleBtn = document.getElementById('mobile-menu-toggle');
      const drawer = document.getElementById('mobile-drawer');
      if (toggleBtn && drawer) {
        toggleBtn.addEventListener('click', () => drawer.classList.toggle('is-open'));
        drawer.querySelectorAll('[data-close-drawer]').forEach(l => l.addEventListener('click', () => drawer.classList.remove('is-open')));
      }

      document.querySelectorAll('[data-showcase-tab]').forEach(tab => {
        tab.addEventListener('click', () => {
          const proj = siteConfig.showcaseProjects.find(p => p.id === tab.getAttribute('data-showcase-tab'));
          if (!proj) return;
          document.querySelectorAll('[data-showcase-tab]').forEach(t => t.classList.remove('is-active'));
          tab.classList.add('is-active');
          document.getElementById('showcase-domain-url').textContent = '🔒 https://' + proj.domainPreview;
          document.getElementById('showcase-mockup-frame').innerHTML = renderMockupInner(proj);
        });
      });

      document.querySelectorAll('[data-device-mode]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('[data-device-mode]').forEach(b => b.classList.remove('is-active'));
          btn.classList.add('is-active');
          document.getElementById('showcase-mockup-frame').classList.toggle('is-mobile', btn.getAttribute('data-device-mode') === 'mobile');
        });
      });

      let currentStep = 1;
      const form = document.getElementById('quote-multi-step-form');
      const prevBtn = document.getElementById('btn-wizard-prev');
      const nextBtn = document.getElementById('btn-wizard-next');
      const submitBtn = document.getElementById('btn-submit-quote');
      const packageBanner = document.getElementById('wizard-package-banner');
      const errorBanner = document.getElementById('wizard-error-banner');
      const confirmationScreen = document.getElementById('wizard-confirmation-screen');

      function selectPackage(pkgId, showNotice) {
        document.querySelectorAll('[data-package-card]').forEach(card => {
          const match = card.getAttribute('data-package-card') === pkgId;
          card.classList.toggle('is-selected', match);
          card.querySelector('input').checked = match;
        });
        if (showNotice) {
          const pkg = siteConfig.packages.find(p => p.id === pkgId);
          if (pkg) {
            packageBanner.textContent = `Hai selezionato il ${pkg.name} (${pkg.price} una tantum).`;
            packageBanner.classList.add('is-visible');
          }
        }
      }

      document.querySelectorAll('[data-package-card]').forEach(c => c.addEventListener('click', () => selectPackage(c.getAttribute('data-package-card'), false)));
      document.querySelectorAll('[data-select-package]').forEach(b => b.addEventListener('click', () => {
        selectPackage(b.getAttribute('data-select-package'), true);
        document.getElementById('richiedi-sito').scrollIntoView({ behavior: 'smooth' });
      }));

      document.querySelectorAll('[data-style-card]').forEach(c => c.addEventListener('click', () => {
        document.querySelectorAll('[data-style-card]').forEach(x => x.classList.remove('is-selected'));
        c.classList.add('is-selected');
        c.querySelector('input').checked = true;
      }));

      document.querySelectorAll('[data-color-chip], [data-section-chip]').forEach(chip => {
        const cb = chip.querySelector('input');
        cb.addEventListener('change', () => chip.classList.toggle('is-selected', cb.checked));
      });

      document.querySelectorAll('[data-radio-btn]').forEach(lbl => {
        const grp = lbl.getAttribute('data-radio-btn');
        const rd = lbl.querySelector('input');
        rd.addEventListener('change', () => {
          document.querySelectorAll(`[data-radio-btn="${grp}"]`).forEach(x => x.classList.remove('is-selected'));
          if (rd.checked) lbl.classList.add('is-selected');
        });
      });

      function validateStep(step) {
        errorBanner.classList.remove('is-visible');
        form.querySelectorAll('.field-error-msg').forEach(e => e.textContent = '');
        let ok = true;
        if (step === 1) {
          if (document.getElementById('input-full-name').value.trim().length < 2) { document.getElementById('err-full-name').textContent = 'Inserisci nome e cognome.'; ok = false; }
          if (document.getElementById('input-business-name').value.trim().length < 2) { document.getElementById('err-business-name').textContent = 'Inserisci il nome attività.'; ok = false; }
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(document.getElementById('input-email').value.trim())) { document.getElementById('err-email').textContent = 'Email non valida.'; ok = false; }
          if (document.getElementById('input-phone').value.trim().length < 6) { document.getElementById('err-phone').textContent = 'Telefono non valido.'; ok = false; }
          if (!document.getElementById('select-business-type').value) { document.getElementById('err-business-type').textContent = 'Seleziona il tipo di attività.'; ok = false; }
        } else if (step === 3) {
          const secs = Array.from(form.querySelectorAll('input[name="sections"]:checked'));
          if (secs.length === 0) { document.getElementById('err-sections').textContent = 'Seleziona almeno una sezione.'; ok = false; }
          if (document.getElementById('textarea-description').value.trim().length < 10) { document.getElementById('err-description').textContent = 'Inserisci una breve descrizione (min. 10 caratteri).'; ok = false; }
        } else if (step === 4) {
          if (!document.getElementById('select-timeline').value) { document.getElementById('err-timeline').textContent = 'Seleziona una tempistica.'; ok = false; }
          if (!document.getElementById('checkbox-privacy').checked) { document.getElementById('err-privacy').textContent = 'Consenso obbligatorio.'; ok = false; }
        }
        return ok;
      }

      function goToStep(step) {
        currentStep = step;
        document.querySelectorAll('[data-step-pane]').forEach(p => p.classList.toggle('is-active', Number(p.getAttribute('data-step-pane')) === step));
        document.querySelectorAll('[data-step-indicator]').forEach(ind => {
          const s = Number(ind.getAttribute('data-step-indicator'));
          ind.classList.toggle('is-active', s === step);
          ind.classList.toggle('is-completed', s < step);
        });
        prevBtn.style.visibility = step > 1 ? 'visible' : 'hidden';
        nextBtn.style.display = step < 4 ? 'inline-flex' : 'none';
        submitBtn.style.display = step === 4 ? 'inline-flex' : 'none';

        if (step === 4) {
          const pkgId = form.querySelector('input[name="selectedPackage"]:checked')?.value || 'plus';
          const pkg = siteConfig.packages.find(p => p.id === pkgId);
          const style = form.querySelector('input[name="style"]:checked')?.value || 'Moderno';
          const secs = Array.from(form.querySelectorAll('input[name="sections"]:checked')).map(x => x.value).join(', ');
          document.getElementById('quote-summary-content').innerHTML = `
            <div><span class="summary-item-label">Cliente</span><span class="summary-item-val">${document.getElementById('input-full-name').value} (${document.getElementById('input-business-name').value})</span></div>
            <div><span class="summary-item-label">Contatti</span><span class="summary-item-val">${document.getElementById('input-email').value} · ${document.getElementById('input-phone').value}</span></div>
            <div><span class="summary-item-label">Pacchetto</span><span class="summary-item-val" style="color:var(--accent-blue)">${pkg ? pkg.name + ' (' + pkg.price + ')' : pkgId}</span></div>
            <div><span class="summary-item-label">Stile & Sezioni</span><span class="summary-item-val">${style} · ${secs}</span></div>
          `;
        }
      }

      nextBtn.addEventListener('click', () => { if (validateStep(currentStep)) goToStep(currentStep + 1); });
      prevBtn.addEventListener('click', () => { if (currentStep > 1) goToStep(currentStep - 1); });
      document.getElementById('btn-summary-edit-step1').addEventListener('click', () => goToStep(1));

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!validateStep(4)) return;
        if (document.getElementById('input-website-hp').value) return;

        const fullName = document.getElementById('input-full-name').value.trim();
        const businessName = document.getElementById('input-business-name').value.trim();
        const email = document.getElementById('input-email').value.trim();
        const phone = document.getElementById('input-phone').value.trim();
        const businessType = document.getElementById('select-business-type').value;
        const pkgId = form.querySelector('input[name="selectedPackage"]:checked')?.value || 'plus';
        const pkg = siteConfig.packages.find(p => p.id === pkgId);
        const pkgLabel = pkg ? `${pkg.name} (${pkg.price} una tantum)` : pkgId;
        const style = form.querySelector('input[name="style"]:checked')?.value || 'Moderno';
        const colors = Array.from(form.querySelectorAll('input[name="colors"]:checked')).map(x => x.value).join(', ') || 'Da concordare';
        const hasLogo = form.querySelector('input[name="hasLogo"]:checked')?.value || 'No';
        const wantsWhatsapp = form.querySelector('input[name="wantsWhatsapp"]:checked')?.value || 'Sì';
        const wantsBooking = form.querySelector('input[name="wantsBooking"]:checked')?.value || 'No';
        const wantsShowcase = form.querySelector('input[name="wantsCatalog"]:checked')?.value || 'Sì';
        const sections = Array.from(form.querySelectorAll('input[name="sections"]:checked')).map(x => x.value).join(', ');
        const description = document.getElementById('textarea-description').value.trim();
        const referenceLinks = document.getElementById('input-reference-links').value.trim() || 'Nessuno';
        const timeline = document.getElementById('select-timeline').value;
        const additionalNotes = document.getElementById('textarea-additional-notes').value.trim() || 'Nessuna';

        const origBtnText = submitBtn.textContent;
        submitBtn.disabled = true;
        submitBtn.textContent = 'Invio in corso...';
        errorBanner.classList.remove('is-visible');

        try {
          const response = await fetch(`https://formsubmit.co/ajax/${siteConfig.contact.email}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify({
              _subject: `Nuova Richiesta Sito Web: ${businessName} (${pkg ? pkg.shortName : pkgId})`,
              _template: 'table',
              _captcha: 'false',
              _replyto: email,
              '1. Nome e Cognome': fullName,
              '2. Nome Attività': businessName,
              '3. Tipo di Attività': businessType,
              '4. Email Cliente': email,
              '5. Telefono Cliente': phone,
              '6. Pacchetto Scelto': pkgLabel,
              '7. Stile Desiderato': style,
              '8. Colori Principali': colors,
              '9. Ha già un Logo': hasLogo,
              '10. Pulsante WhatsApp': wantsWhatsapp,
              '11. Sistema Prenotazioni': wantsBooking,
              '12. Vetrina Prodotti/Servizi': wantsShowcase,
              '13. Sezioni da Includere': sections,
              '14. Descrizione Progetto': description,
              '15. Siti di Riferimento': referenceLinks,
              '16. Tempistica Desiderata': timeline,
              '17. Note Aggiuntive': additionalNotes
            })
          });

          if (!response.ok) {
            throw new Error('Errore durante l’invio');
          }

          form.style.display = 'none';
          packageBanner.classList.remove('is-visible');
          confirmationScreen.classList.add('is-visible');
        } catch (err) {
          errorBanner.textContent = 'Si è verificato un problema di connessione. Riprova tra qualche istante o scrivici a ' + siteConfig.contact.email;
          errorBanner.classList.add('is-visible');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = origBtnText;
        }
      });

      document.getElementById('btn-reset-wizard').addEventListener('click', () => {
        form.reset();
        confirmationScreen.classList.remove('is-visible');
        form.style.display = 'block';
        selectPackage('plus', false);
        goToStep(1);
      });

      document.querySelectorAll('[data-open-modal]').forEach(b => b.addEventListener('click', () => document.getElementById(b.getAttribute('data-open-modal')).classList.add('is-open')));
      document.querySelectorAll('[data-close-modal]').forEach(b => b.addEventListener('click', () => document.getElementById(b.getAttribute('data-close-modal')).classList.remove('is-open')));
    }

    renderApp();
  </script>
</body>
</html>
